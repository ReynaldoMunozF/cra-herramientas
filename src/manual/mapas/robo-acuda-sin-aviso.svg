<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" role="img" aria-labelledby="t d">
<title id="t">Robo con acuda sin aviso</title><desc id="d">Flujo completo de robo con acuda y sin aviso.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#60758a"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity=".14"/></filter><style>text{font-family:Segoe UI,Arial;fill:#17324d}.h{font-size:38px;font-weight:800;fill:white}.sub{font-size:16px;fill:white}.n{fill:white;stroke:#d9e7ef;stroke-width:2;filter:url(#s)}.q{fill:#fff7d8;stroke:#d79b28;stroke-width:3}.r{fill:#e9f7fe;stroke:#019df4;stroke-width:3}.c{fill:#fff0ef;stroke:#963b34;stroke-width:3}.act{fill:#eff8ed;stroke:#53863d;stroke-width:3}.tx{font-size:18px;font-weight:750;text-anchor:middle}.sm{font-size:14px;fill:#60758a;text-anchor:middle}.ln{fill:none;stroke:#60758a;stroke-width:3;marker-end:url(#a)}.lab{font-size:13px;font-weight:800;fill:#0077b8;text-anchor:middle}</style></defs>
<rect width="1400" height="1120" rx="25" fill="#f2f7fa"/><path d="M25 0H1375Q1400 0 1400 25V115H0V25Q0 0 25 0Z" fill="#963b34"/><text x="50" y="55" class="h">ROBO CON ACUDA · SIN AVISO</text><text x="52" y="87" class="sub">La alarma no confirmada sin respuesta deriva directamente al acuda</text>
<rect x="55" y="165" width="220" height="82" rx="15" class="c"/><text x="165" y="198" class="tx">Señal de robo</text><text x="165" y="225" class="sm">Iniciar gestión</text><path d="M275 206H350" class="ln"/><rect x="350" y="165" width="260" height="82" rx="15" class="n"/><text x="480" y="198" class="tx">Llamar instalación</text><text x="480" y="225" class="sm">¿Contestan?</text>
<path d="M480 247V330H270" class="ln"/><text x="400" y="315" class="lab">SÍ</text><rect x="135" y="330" width="270" height="82" rx="15" class="q"/><text x="270" y="363" class="tx">¿Dan clave?</text><text x="270" y="390" class="sm">Validar palabra clave</text><path d="M135 371H85V485" class="ln"/><rect x="35" y="485" width="235" height="100" rx="15" class="r"/><text x="152" y="520" class="tx">No confirmada</text><text x="152" y="550" class="sm">Informar y cerrar</text><path d="M405 371H470V485" class="ln"/><rect x="350" y="485" width="260" height="135" rx="15" class="c"/><text x="480" y="520" class="tx">Confirmada</text><text x="480" y="550" class="sm">1. Contactos</text><text x="480" y="575" class="sm">2. Acuda</text><text x="480" y="600" class="sm">3. FCSE</text>
<path d="M610 206H760" class="ln"/><text x="680" y="190" class="lab">NO CONTESTAN</text><rect x="760" y="165" width="285" height="82" rx="15" class="q"/><text x="902" y="198" class="tx">¿Confirmada?</text><text x="902" y="225" class="sm">Secuencial / vídeo / no</text><path d="M850 247V360H760" class="ln"/><text x="800" y="343" class="lab">NO</text><rect x="635" y="360" width="250" height="110" rx="15" class="act"/><text x="760" y="398" class="tx">Enviar acuda</text><text x="760" y="430" class="sm">Sin aviso previo</text><text x="760" y="454" class="sm">Alarma no confirmada</text>
<path d="M1045 206H1180V330" class="ln"/><text x="1110" y="190" class="lab">SÍ</text><rect x="1060" y="330" width="270" height="82" rx="15" class="q"/><text x="1195" y="363" class="tx">Tipo de verificación</text><text x="1195" y="390" class="sm">Secuencial o vídeo</text><path d="M1150 412V500" class="ln"/><rect x="1030" y="500" width="250" height="155" rx="15" class="act"/><text x="1155" y="535" class="tx">Secuencial</text><text x="1155" y="568" class="sm">Día: 1. Acuda · 2. FCSE</text><text x="1155" y="598" class="sm">Noche: 1. FCSE · 2. Acuda</text><path d="M1245 412V725" class="ln"/><rect x="1010" y="725" width="330" height="175" rx="15" class="act"/><text x="1175" y="760" class="tx">Verificación por vídeo</text><text x="1175" y="793" class="sm">Sospechosa:</text><text x="1175" y="820" class="sm">1. FCSE · 2. Acuda · 3. Contactos</text><text x="1175" y="853" class="sm">No sospechosa:</text><text x="1175" y="880" class="sm">1. Contactos · 2. Acuda · 3. FCSE</text>
<rect x="55" y="950" width="1290" height="100" rx="18" fill="#fff7d8" stroke="#d79b28" stroke-width="2"/><text x="700" y="988" class="tx">Importante</text><text x="700" y="1020" class="sm">Registrar el envío del acuda y el resto de actuaciones. Ante excepciones prevalecen el manual y las órdenes especiales.</text>
