<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" role="img" aria-labelledby="t d">
<title id="t">Robo con acuda con aviso</title><desc id="d">Flujo completo de robo con acuda y con aviso.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#60758a"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity=".14"/></filter><style>text{font-family:Segoe UI,Arial;fill:#17324d}.h{font-size:38px;font-weight:800;fill:white}.sub{font-size:16px;fill:white}.n{fill:white;stroke:#d9e7ef;stroke-width:2;filter:url(#s)}.q{fill:#fff7d8;stroke:#d79b28;stroke-width:3}.r{fill:#e9f7fe;stroke:#019df4;stroke-width:3}.c{fill:#fff0ef;stroke:#963b34;stroke-width:3}.act{fill:#eff8ed;stroke:#53863d;stroke-width:3}.tx{font-size:18px;font-weight:750;text-anchor:middle}.sm{font-size:14px;fill:#60758a;text-anchor:middle}.ln{fill:none;stroke:#60758a;stroke-width:3;marker-end:url(#a)}.lab{font-size:13px;font-weight:800;fill:#0077b8;text-anchor:middle}</style></defs>
<rect width="1400" height="1120" rx="25" fill="#f2f7fa"/><path d="M25 0H1375Q1400 0 1400 25V115H0V25Q0 0 25 0Z" fill="#963b34"/><text x="50" y="55" class="h">ROBO CON ACUDA · CON AVISO</text><text x="52" y="87" class="sub">El acuda se incorpora a las actuaciones confirmadas</text>
<rect x="55" y="165" width="220" height="82" rx="15" class="c"/><text x="165" y="198" class="tx">Señal de robo</text><text x="165" y="225" class="sm">Iniciar gestión</text><path d="M275 206H350" class="ln"/><rect x="350" y="165" width="260" height="82" rx="15" class="n"/><text x="480" y="198" class="tx">Llamar instalación</text><text x="480" y="225" class="sm">¿Contestan?</text>
<path d="M480 247V330H270" class="ln"/><text x="400" y="315" class="lab">SÍ</text><rect x="135" y="330" width="270" height="82" rx="15" class="q"/><text x="270" y="363" class="tx">¿Dan clave?</text><text x="270" y="390" class="sm">Validar palabra clave</text><path d="M135 371H85V485" class="ln"/><rect x="35" y="485" width="235" height="100" rx="15" class="r"/><text x="152" y="520" class="tx">No confirmada</text><text x="152" y="550" class="sm">Informar y gestionar</text><path d="M405 371H470V485" class="ln"/><rect x="350" y="485" width="250" height="115" rx="15" class="c"/><text x="475" y="520" class="tx">Confirmada</text><text x="475" y="550" class="sm">1. Contactos</text><text x="475" y="575" class="sm">2. FCSE y acuda</text>
<path d="M610 206H760" class="ln"/><text x="680" y="190" class="lab">NO CONTESTAN</text><rect x="760" y="165" width="285" height="82" rx="15" class="q"/><text x="902" y="198" class="tx">¿Verificación?</text><text x="902" y="225" class="sm">No · secuencial · vídeo</text><path d="M902 247V330H735" class="ln"/><rect x="620" y="330" width="230" height="82" rx="15" class="n"/><text x="735" y="363" class="tx">Contactos</text><text x="735" y="390" class="sm">¿Contesta alguno?</text><path d="M680 412V485" class="ln"/><rect x="585" y="485" width="190" height="100" rx="15" class="r"/><text x="680" y="520" class="tx">Sí contestan</text><text x="680" y="550" class="sm">Informar previa clave</text><path d="M790 412V485H920" class="ln"/><rect x="810" y="485" width="220" height="100" rx="15" class="r"/><text x="920" y="520" class="tx">No contestan</text><text x="920" y="550" class="sm">Enviar SMS</text>
<path d="M1045 206H1180V330" class="ln"/><rect x="1060" y="330" width="270" height="82" rx="15" class="q"/><text x="1195" y="363" class="tx">Confirmada</text><text x="1195" y="390" class="sm">Secuencial o vídeo</text><path d="M1150 412V500" class="ln"/><rect x="1035" y="500" width="250" height="145" rx="15" class="act"/><text x="1160" y="535" class="tx">Secuencial</text><text x="1160" y="566" class="sm">Día: contactos → FCSE + acuda</text><text x="1160" y="594" class="sm">Noche: FCSE + acuda → contactos</text><path d="M1240 412V710" class="ln"/><rect x="1015" y="710" width="320" height="145" rx="15" class="act"/><text x="1175" y="745" class="tx">Vídeo</text><text x="1175" y="777" class="sm">Sospechosa: FCSE + acuda → contactos</text><text x="1175" y="805" class="sm">No: contactos → FCSE + acuda</text>
<rect x="55" y="930" width="1290" height="105" rx="18" fill="#fff7d8" stroke="#d79b28" stroke-width="2"/><text x="700" y="970" class="tx">Finalización</text><text x="700" y="1003" class="sm">Registrar contactos, FCSE y envío de acuda. Aplicar recordatorio según el manual vigente.</text>
